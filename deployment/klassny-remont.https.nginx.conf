server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 89.117.149.68 _;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow" always;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name krem.moscow www.krem.moscow;

    server_tokens off;
    client_max_body_size 5m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://krem.moscow$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.krem.moscow;

    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/krem.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krem.moscow/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://krem.moscow$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name krem.moscow;

    server_tokens off;
    client_max_body_size 5m;
    ssl_certificate /etc/letsencrypt/live/krem.moscow/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krem.moscow/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
